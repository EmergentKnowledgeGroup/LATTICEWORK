        - heading "How It Works" [level=3] [ref=f3e135]
        - generic [ref=f3e136]: ▼
      - generic [ref=f3e137]:
        - heading "What is an API Key?" [level=4] [ref=f3e138]
        - paragraph [ref=f3e139]: An API key is like a password that lets your browser talk directly to an AI provider. You get one from the provider's website (often for free), paste it here, and FreeLattice uses it to send your messages to the AI. The key stays in your browser — we never see it or store it on any server.
        - heading "Cloud vs. Local — What's the Difference?" [level=4] [ref=f3e140]
        - paragraph [ref=f3e141]:
          - strong [ref=f3e142]: Cloud
          - text: means your messages are sent to a company's servers (like Groq or Together AI) where the AI model runs. It's fast and easy — you just need an API key. The provider processes your message and sends back a response.
        - paragraph [ref=f3e143]:
          - strong [ref=f3e144]: Local
          - text: means the AI runs on your own computer using Ollama. Nothing leaves your machine. It's completely private, but requires some setup and a reasonably powerful computer.
        - heading "What is Ollama?" [level=4] [ref=f3e145]
        - paragraph [ref=f3e146]:
          - text: Ollama is free software that lets you download and run AI models on your own computer. Once installed, you can run models like Llama, DeepSeek-R1, Qwen 2.5, Mistral, and more — all offline, all private. Visit
          - link "ollama.ai" [ref=f3e147] [cursor=pointer]:
            - /url: https://ollama.ai
          - text: to get started.
        - heading "Ollama CORS Troubleshooting" [level=4] [ref=f3e148]
        - paragraph [ref=f3e149]:
          - text: If you're using FreeLattice from a website (like GitHub Pages) and connecting to local Ollama, your browser may block the connection due to CORS security.
          - strong [ref=f3e150]: "Best fix:"
          - text: Run FreeLattice locally with
          - code [ref=f3e151]: node server.js
          - text: or
          - code [ref=f3e152]: python server.py
          - text: — the built-in server includes an Ollama proxy that eliminates CORS entirely.
        - paragraph [ref=f3e153]:
          - strong [ref=f3e154]: "Alternative — Manual CORS fix (3 steps):"
          - strong [ref=f3e155]: 1. Stop Ollama first
          - text: — Ollama auto-starts on install, so you must quit it before restarting with CORS.
          - strong [ref=f3e156]: "Windows:"
          - text: Right-click the Ollama icon in the system tray (bottom-right near the clock) → "Quit".
          - strong [ref=f3e157]: "Mac:"
          - text: Click the Ollama icon in the menu bar (top-right) → "Quit Ollama" (or run
          - code [ref=f3e158]: pkill ollama
          - text: ).
          - strong [ref=f3e159]: "Linux:"
          - text: Run
          - code [ref=f3e160]: systemctl stop ollama
          - text: or
          - code [ref=f3e161]: pkill ollama
          - text: .
          - strong [ref=f3e162]: "2. Run with CORS enabled:"
          - code [ref=f3e163]: OLLAMA_ORIGINS=* ollama serve
          - text: (Mac/Linux) or
          - code [ref=f3e164]: set OLLAMA_ORIGINS=* && ollama serve
          - text: (Windows cmd).
          - strong [ref=f3e165]: 3. Retry
          - text: the connection in FreeLattice.
        - paragraph [ref=f3e166]:
          - strong [ref=f3e167]: Getting "port already in use" error?
          - text: That means you skipped Step 1 — Ollama is still running. Quit it first, then try the command again.
        - paragraph [ref=f3e168]:
          - strong [ref=f3e169]: "Make it permanent:"
          - strong [ref=f3e170]: "Windows:"
          - text: "Open System Settings → Search \"Environment Variables\" → Under System Variables, click New → Variable name:"
          - code [ref=f3e171]: OLLAMA_ORIGINS
          - text: ", Variable value:"
          - code [ref=f3e172]: "*"
          - text: → OK → Restart Ollama normally.
          - strong [ref=f3e173]: "Mac:"
          - text: Run
          - code [ref=f3e174]: launchctl setenv OLLAMA_ORIGINS '*'
          - text: in Terminal, then restart Ollama.
          - strong [ref=f3e175]: "Linux:"
          - text: Run
          - code [ref=f3e176]: echo 'export OLLAMA_ORIGINS="*"' >> ~/.bashrc
          - text: and restart Ollama. FreeLattice will auto-detect the best connection method on startup.
        - heading "Where Can I Get Free API Keys?" [level=4] [ref=f3e177]
        - paragraph [ref=f3e178]:
          - strong [ref=f3e179]: Groq
          - text: — Sign up at
          - link "console.groq.com" [ref=f3e180] [cursor=pointer]:
            - /url: https://console.groq.com
          - text: for a free API key with generous rate limits. This is the easiest way to start.
        - paragraph [ref=f3e181]:
          - strong [ref=f3e182]: Together AI
          - text: — Sign up at
          - link "api.together.xyz" [ref=f3e183] [cursor=pointer]:
            - /url: https://api.together.xyz
          - text: . New accounts get free credits.
        - paragraph [ref=f3e184]:
          - strong [ref=f3e185]: OpenRouter
          - text: — Visit
          - link "openrouter.ai" [ref=f3e186] [cursor=pointer]:
            - /url: https://openrouter.ai
          - text: . Some models have free tiers.
        - paragraph [ref=f3e187]:
          - strong [ref=f3e188]: xAI
          - text: — Visit
          - link "console.x.ai" [ref=f3e189] [cursor=pointer]:
            - /url: https://console.x.ai
          - text: for Grok API access.
        - heading "How Are My Files Used?" [level=4] [ref=f3e190]
        - paragraph [ref=f3e191]: When you drop files into the Memory & Context area, they are read entirely in your browser using JavaScript. The text content is included at the beginning of your conversation so the AI has context. Files are never uploaded to any server — they stay on your device.
        - heading "What's New in v2?" [level=4] [ref=f3e192]
        - paragraph [ref=f3e193]:
          - strong [ref=f3e194]: Persistent Memory
          - text: — Your conversations are stored in IndexedDB and survive browser closes, restarts, and reboots. The AI builds a memory summary of key facts you share, so it remembers you across sessions.
        - paragraph [ref=f3e195]:
          - strong [ref=f3e196]: File System Access
          - text: — Open a project folder from your computer. The AI can read your files and you can save AI-generated code directly to your workspace.
        - paragraph [ref=f3e197]:
          - strong [ref=f3e198]: GitHub Integration
          - text: — Connect your GitHub account to browse repos, read code, and push changes — all from within FreeLattice.
        - paragraph [ref=f3e199]:
          - strong [ref=f3e200]: Self-Improving Agent
          - text: — The AI can suggest improvements to its own system prompt. You review and approve changes, shaping how your AI behaves over time.
        - heading "What's New in v2.2?" [level=4] [ref=f3e201]
        - paragraph [ref=f3e202]:
          - strong [ref=f3e203]: Multi-Conversation Management
          - text: — Create, name, switch between, and delete multiple conversations. Each conversation has its own chat history, while your memory summary is shared across all of them. A collapsible sidebar lets you browse, search, and manage all your conversations. On mobile, it slides out as a panel.
        - paragraph [ref=f3e204]:
          - strong [ref=f3e205]: Conversation Context Notes
          - text: — When creating a new conversation, you can add a topic or context note (e.g., "This conversation is about my Python project") that gets included in the system prompt for that conversation only.
        - heading "What's New in v2.1?" [level=4] [ref=f3e206]
        - paragraph [ref=f3e207]:
          - strong [ref=f3e208]: φ-Salt Encryption
          - text: — Your API keys and GitHub tokens are now encrypted using AES-GCM with a PBKDF2-derived key based on a φ-salt (golden-ratio) derivation. No more plaintext secrets in localStorage.
        - paragraph [ref=f3e209]:
          - strong [ref=f3e210]: Input Sanitization
          - text: — All user-generated content is sanitized against XSS before being displayed in the DOM, including chat messages, file names, and loaded file content.
        - paragraph [ref=f3e211]:
          - strong [ref=f3e212]: Memory Integrity
          - text: — Exported memory files now include a φ-hash integrity signature. When importing, FreeLattice verifies the hash and warns you if the file has been tampered with.
        - paragraph [ref=f3e213]:
          - strong [ref=f3e214]: AI Disclaimers
          - text: — Clear notices that AI responses may contain errors, encouraging users to verify important information.
        - heading "What's New in v5.2?" [level=4] [ref=f3e215]
        - paragraph [ref=f3e216]:
          - strong [ref=f3e217]: Ollama Proxy Server
          - text: — The built-in server (server.js / server.py) now includes an Ollama proxy that eliminates CORS issues entirely. Run FreeLattice locally and connect to Ollama with zero configuration.
        - paragraph [ref=f3e218]:
          - strong [ref=f3e219]: Smart Connection Detection
          - text: "— FreeLattice automatically detects the best way to connect to Ollama: proxy first, then direct. No more manual CORS configuration needed when running locally."
        - paragraph [ref=f3e220]:
          - strong [ref=f3e221]: Improved Ollama Setup
          - text: — Better error messages, guided troubleshooting, and one-click model selection. The CORS help modal now recommends self-hosting as the primary fix.
        - paragraph [ref=f3e222]:
          - strong [ref=f3e223]: Persistent Memory Index
          - text: — Conversations are stored locally and searchable. Your AI remembers context across sessions.
        - paragraph [ref=f3e224]:
          - strong [ref=f3e225]: Marketplace & Lattice Points
          - text: — Community-driven bounty economy and reputation system for mesh network participants.
        - heading "Is This Really Free?" [level=4] [ref=f3e226]
        - paragraph [ref=f3e227]: Yes. FreeLattice is open source under the MIT License. The software is free forever. Some API providers offer free tiers (like Groq), and running locally with Ollama costs nothing beyond your electricity. No one profits from this — it's built by a community that believes AI should be accessible to everyone.
    - button "✦ Help FreeLattice Grow — Suggest a Feature" [ref=f3e229] [cursor=pointer]

name: Bug report
description: Report a reproducible defect in LATTICEWORK
title: "[BUG] "
labels:
  - bug
body:
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.1.0 or full commit SHA
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, browser, runtime, model provider, and relevant configuration
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Logs, screenshots, traces, test output, or minimal fixture
  - type: dropdown
    id: data
    attributes:
      label: Does this involve user data, API keys, identity, cryptography, or privacy?
      options:
        - "No"
        - "Yes"
        - "Unsure"
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues
          required: true
        - label: I removed secrets and personal data
          required: true
